name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    env:
      BUN_CONFIG_INSTALL_AUTO: disable
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed generated artifacts before build
        run: bun scripts/verify-generated-artifacts.mjs

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun node_modules/typescript/bin/tsc --noEmit

      - name: Typecheck pinned public compatibility declarations
        run: bun scripts/check-declaration-compatibility.mjs

      - name: Build and reverify generated artifacts
        run: |
          bun scripts/build.mjs
          bun scripts/verify-generated-artifacts.mjs
          git diff --exit-code -- src/generated dist bin generated-artifacts.json repository-generated-artifacts.json
          test -z "$(git ls-files --others --exclude-standard -- src/generated dist bin generated-artifacts.json repository-generated-artifacts.json)"

      - name: Verify local package extraction boundary
        run: bun scripts/check-package-extraction.mjs

      - name: Verify deterministic modes and bytes across umasks
        if: runner.os == 'Linux'
        run: bun scripts/check-build-determinism.mjs

  windows-containment:
    env:
      BUN_CONFIG_INSTALL_AUTO: disable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Verify unsupported-platform fail-closed contract
        run: bun test tests/windows-platform-containment.test.ts --timeout 20000
