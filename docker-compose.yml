# @hasna/knowledge — Stage-A local-only contained service.
# The public HTTP process exposes health and metadata while data routes remain
# fail closed. No hosted storage, provider, or credential surface is enabled.
services:
  serve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hasna-knowledge-serve
    environment:
      PORT: "8080"
      HASNA_KNOWLEDGE_STORAGE_MODE: local
    ports:
      - "8080:8080"
