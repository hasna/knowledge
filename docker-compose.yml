# @hasna/knowledge — local development stack.
#
# Provides a throwaway Postgres for exercising cloud mode (PURE REMOTE per
# Amendment A1) against a local database instead of the shared RDS. The
# knowledge CLI/MCP itself runs on the host; point it at this Postgres with:
#
#   export HASNA_KNOWLEDGE_STORAGE_MODE=cloud
#   export HASNA_KNOWLEDGE_DATABASE_URL=postgres://knowledge:knowledge@localhost:5432/knowledge
#   knowledge db init            # or run the storage-kit migrations
#
# Never commit real credentials; the values below are local-only throwaways.
services:
  postgres:
    image: postgres:16
    container_name: hasna-knowledge-postgres
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - knowledge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knowledge-pgdata:
